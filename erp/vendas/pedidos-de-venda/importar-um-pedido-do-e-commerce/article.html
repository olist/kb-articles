<h1>Importar um pedido do e-commerce</h1>
<p>Você importa um pedido do ecommerce para a lista de pedidos de venda do ERP da Olist. O comando fica em <strong>Mais ações</strong>, na lista de pedidos.</p>
<h2>Instruções</h2>
<ol>
<li>Acesse <strong>Vendas &gt; Pedidos de Venda</strong>.</li>
<li>Clique em <strong>Mais ações &gt; Importar pedido do e-commerce</strong>.</li>
</ol>
</article>
