<h1>Criar embalagens dos Correios</h1>
<p>No ERP da Olist, você inicia a criação das embalagens dos Correios a partir da lista de embalagens de produtos. O botão <strong>Criar embalagens Correios</strong> fica nessa lista.</p>
<h2>Instruções</h2>
<ol>
<li>
<p>Acesse <strong>Cadastros &gt; Embalagens</strong>.</p>
<p><img src="screenshots/34.png" alt="Lista de embalagens com Criar embalagens Correios" /></p>
</li>
<li>
<p>Clique em <strong>Criar embalagens Correios</strong>.</p>
</li>
</ol>
