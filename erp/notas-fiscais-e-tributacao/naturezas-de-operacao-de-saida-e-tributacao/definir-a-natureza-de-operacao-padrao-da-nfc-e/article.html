<!DOCTYPE html>

<body>
<article>
<h1>Definir a natureza de operação padrão da NFC-e</h1>
<h2>Instruções</h2>
<ol>
<li>
<p>Acesse <strong>Configurações &gt; Configurações ERP</strong>.</p>
</li>
<li>
<p>Abra a aba <strong>Notas Fiscais</strong>.</p>
<p><img src="screenshots/54.png" alt="Aba Notas Fiscais com o atalho Naturezas de operação de saída (tributação)" /></p>
</li>
<li>
<p>Clique em <strong>Naturezas de operação de saída (tributação)</strong>.</p>
</li>
<li>
<p>Na linha da natureza, abra o menu de ações.</p>
<p><img src="screenshots/52.png" alt="Menu de ações da linha, com a opção Tornar padrão para NFC-e" /></p>
</li>
<li>
<p>Clique em <strong>Tornar padrão para NFC-e</strong>.</p>
</li>
</ol>
</article>
</body>
</html>
