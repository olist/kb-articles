<!DOCTYPE html>

<meta charset="utf-8">
<title>Clonar uma natureza de operação</title>
</head>
<body>
<article>
<h1>Clonar uma natureza de operação</h1>
<h2>Instruções</h2>
<ol>
<li>
<p>Acesse <strong>Configurações &gt; Configurações ERP</strong>.</p>
</li>
<li>
<p>Abra a aba <strong>Notas Fiscais</strong>.</p>
</li>
<li>
<p>Clique em <strong>Naturezas de operação de saída (tributação)</strong>.</p>
</li>
<li>
<p>Abra o menu de ações da linha da natureza que você quer clonar.</p>
<p><img src="screenshots/52.png" alt="Menu de ações da linha com Clonar operação" /></p>
</li>
<li>
<p>Clique em <strong>Clonar operação</strong>.</p>
</li>
</ol>
</article>
</body>
</html>
