<article>
<h1>Transformar uma natureza de saída em operação de entrada</h1>
<h2>Instruções</h2>
<ol>
<li>
<p>Acesse <strong>Configurações &gt; Configurações ERP</strong>.</p>
</li>
<li>
<p>Abra a aba <strong>Notas Fiscais</strong>.</p>
<p><img src="screenshots/54.png" alt="Aba Notas Fiscais com o atalho Naturezas de operação de saída (tributação)" /></p>
</li>
<li>
<p>Clique em <strong>Naturezas de operação de saída (tributação)</strong>.</p>
</li>
<li>
<p>No menu de ações da linha, clique em <strong>Tornar operação de entrada</strong>.</p>
<p><img src="screenshots/52.png" alt="Menu de ações da linha com Tornar operação de entrada" /></p>
</li>
</ol>
</article>
